<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green API</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      max-width: 700px;
      width: 100%;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #14532d;
      color: #86efac;
      font-size: 14px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 16px;
    }

    p {
      color: #cbd5e1;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 14px 24px;
      background: #22c55e;
      color: #052e16;
      text-decoration: none;
      border-radius: 14px;
      font-weight: bold;
    }

    .footer {
      margin-top: 30px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="badge">CI/CD работает</div>

      <h1>Green API</h1>

      <p>
        Это простая HTML-страница, которая деплоится на VPS через
        GitHub Actions, Docker и docker compose.
      </p>

      <a class="btn" href="#">Deploy Success</a>

      <div class="footer">
        GitHub Actions → VPS → Docker → Nginx
      </div>
    </section>
  </main>
</body>
</html>
